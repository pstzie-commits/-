# KGS Code (한국가스안전공사 시설·기술·검사 기준) 기반 체크리스트
#
# ⚠️ 중요: 아래 항목의 "reference"는 일반적으로 알려진 KGS Code 계열을 예시로 표기한 것이며,
# 가스 종류(고압가스/LP가스/도시가스/수소)와 설비 용도에 따라 실제 적용 코드 번호·개정판이
# 달라집니다. 반드시 가스기술기준정보시스템(https://cyber.kgs.or.kr)에서 최신 원문을 대조하여
# 프로젝트에 맞게 코드 번호를 갱신한 뒤 사용하세요. 이 파일은 검토의 출발점(스타터 세트)이며
# 자격을 갖춘 가스안전 기술사/안전관리자의 검수가 필요합니다.

categories:
  - name: "저장·제조 시설"
    items:
      - id: KGS-001
        title: 저장능력 산정 및 저장설비 기준
        requirement: >
          저장탱크/저장설비의 저장능력이 산정 기준에 따라 계산되고, 저장설비의 구조·재료·
          내진설계 요건이 명시되어 있는가.
        reference: "KGS FU111(저장의 시설·기술·검사기준) 계열 - 가스 종류별 해당 코드 확인 필요"
      - id: KGS-002
        title: 제조설비 시설기준
        requirement: >
          압축·액화 등 제조공정 설비의 재료, 내압/기밀성능, 안전장치 부착 요건이 도면·사양서에
          반영되어 있는가.
        reference: "KGS FP112(고압가스 일반제조의 시설·기술·검사·감리기준) 계열"
      - id: KGS-003
        title: 충전설비 기준
        requirement: >
          용기·차량 고정탱크 충전설비의 충전기준(과충전 방지, 정전기 제거, 충전소 배치)이
          명시되어 있는가.
        reference: "KGS FP211(충전의 시설·기술·검사기준) 계열"

  - name: "이격거리·방호설비"
    items:
      - id: KGS-004
        title: 보유공지 및 안전거리(이격거리)
        requirement: >
          저장설비·처리설비와 인접 시설(화기, 사업장 경계, 보호시설) 사이에 법정 이격거리 및
          보유공지가 도면에 반영되어 있는가.
        reference: "가스 3법 시행규칙 및 KGS 시설기준 상 안전거리·보유공지 규정"
      - id: KGS-005
        title: 방호벽 설치
        requirement: >
          법정 이격거리를 확보하지 못하는 경우 방호벽(내화/방폭 성능 포함)이 설계에 반영되어
          있는가.
        reference: "KGS 시설기준 상 방호벽 설치기준"
      - id: KGS-006
        title: 정전기 제거 조치
        requirement: >
          가연성 가스를 취급하는 배관·저장설비·충전설비에 접지 등 정전기 제거 조치가
          명시되어 있는가.
        reference: "KGS 공통 시설기준(정전기 제거) 계열"

  - name: "배관 및 이송설비"
    items:
      - id: KGS-007
        title: 배관 재료·두께·용접 기준
        requirement: >
          배관의 재질, 설계압력에 따른 두께 산정, 용접부 비파괴검사 요건이 시방서에 명시되어
          있는가.
        reference: "KGS FP/FU 배관 관련 기준 - 가스 종류별 코드 확인 필요"
      - id: KGS-008
        title: 지하 매설배관 표지 및 깊이
        requirement: >
          지하 매설배관의 매설심도, 라인마크·표지판, 전기방식(음극방식) 조치가 반영되어
          있는가.
        reference: "도시가스사업법령 및 KGS 배관 시설기준"
      - id: KGS-009
        title: 압력용기 내압·기밀시험
        requirement: >
          압력용기 및 배관계통에 대한 내압시험·기밀시험 절차와 판정 기준이 시험계획서에
          포함되어 있는가.
        reference: "KGS AC(검사기준) 계열"

  - name: "안전장치"
    items:
      - id: KGS-010
        title: 안전밸브(릴리프밸브) 및 방출관
        requirement: >
          과압 방지를 위한 안전밸브 용량 산정 근거와 방출관의 방출 방향·높이가 설계에
          반영되어 있는가.
        reference: "KGS 시설기준 상 안전밸브·방출관 설치기준"
      - id: KGS-011
        title: 가스누출검지경보설비
        requirement: >
          가연성·독성 가스 누출 우려 장소에 검지경보설비의 설치 위치, 경보 설정치, 연동
          차단설비가 명시되어 있는가.
        reference: "KGS 시설기준 상 가스누출검지경보장치 기준"
      - id: KGS-012
        title: 긴급차단장치
        requirement: >
          저장탱크·주요 배관에 원격/수동 긴급차단밸브 설치 위치와 작동 조건이 도면·계통도에
          반영되어 있는가.
        reference: "KGS 시설기준 상 긴급차단장치 기준"
      - id: KGS-013
        title: 방폭전기설비
        requirement: >
          위험장소 구분(0/1/2종)에 따른 방폭구조 전기설비 선정 근거가 방폭지역구분도와 함께
          제시되어 있는가.
        reference: "KGS GC(방폭전기설비) 계열 및 관련 KS/IEC 기준"

  - name: "소화·비상대응"
    items:
      - id: KGS-014
        title: 소화설비
        requirement: >
          저장·제조·충전시설 규모에 따른 소화기, 살수장치 등 소화설비의 종류·용량이
          명시되어 있는가.
        reference: "KGS 시설기준 상 소화설비 설치기준"
      - id: KGS-015
        title: 환기설비(밀폐·지하공간)
        requirement: >
          지하 또는 밀폐된 가스 취급공간에 강제/자연 환기설비의 환기량 산정 근거가
          제시되어 있는가.
        reference: "KGS 시설기준 상 환기설비 기준"
      - id: KGS-016
        title: 경계표지 및 위험 표지판
        requirement: >
          저장·제조·충전 시설 경계에 위험 표지판, 화기엄금 표지 등이 배치도에 반영되어
          있는가.
        reference: "KGS 시설기준 상 표지판 설치기준"

  - name: "검사·유지관리"
    items:
      - id: KGS-017
        title: 정기검사·완성검사 대상 여부
        requirement: >
          해당 설비가 완성검사·정기검사·수시검사 대상인지 여부와 검사 주기가 문서에
          식별되어 있는가.
        reference: "고압가스안전관리법 등 가스 3법 상 검사제도 및 KGS AC(검사기준) 계열"
      - id: KGS-018
        title: 안전성평가(위험성평가) 반영 여부
        requirement: >
          설비 설계 단계에서 HAZOP 등 안전성평가 결과가 반영되어 설계 변경 이력에
          기록되어 있는가.
        reference: "고압가스안전관리법 시행규칙 상 안전성평가 규정"
