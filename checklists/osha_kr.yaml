# 산업안전보건법(및 하위법령) 기반 체크리스트
#
# ⚠️ 중요: 법령은 개정이 잦습니다. 아래 조문 번호는 검토 시점(2026년) 기준으로 웹 검색을 통해
# 확인한 것이지만, 반드시 국가법령정보센터(https://law.go.kr)에서 시행일 기준 최신 조문을
# 대조한 뒤 사용하세요. 조문 번호를 확인하지 못한 항목은 reference에 "조번호 확인 필요"로
# 표기했습니다. 이 파일은 검토의 출발점(스타터 세트)이며 자격을 갖춘 안전보건관리자/
# 노무사의 검수가 필요합니다.

categories:
  - name: "안전보건관리체제"
    items:
      - id: OSHA-001
        title: 안전보건관리책임자 선임
        requirement: >
          사업장을 총괄 관리하는 안전보건관리책임자의 선임 및 직무(재해예방계획 수립,
          안전보건관리규정 작성 등)가 문서에 명시되어 있는가.
        reference: "산업안전보건법 제15조(안전보건관리책임자)"
      - id: OSHA-002
        title: 관리감독자 지정
        requirement: >
          작업 현장 단위로 관리감독자가 지정되고 그 직무 범위가 문서화되어 있는가.
        reference: "산업안전보건법 제16조(관리감독자) - 조번호 재확인 필요"
      - id: OSHA-003
        title: 안전관리자 선임
        requirement: >
          사업장 규모·업종에 따른 안전관리자 선임 기준 충족 여부와 자격요건이 명시되어
          있는가.
        reference: "산업안전보건법 제17조(안전관리자)"
      - id: OSHA-004
        title: 산업안전보건위원회 구성·운영
        requirement: >
          노사 동수로 구성되는 산업안전보건위원회의 구성 및 심의·의결 절차가 문서에
          반영되어 있는가.
        reference: "산업안전보건법 제24조(산업안전보건위원회)"

  - name: "사전 심사·신고 제도"
    items:
      - id: OSHA-005
        title: 유해위험방지계획서 작성·제출 대상 여부
        requirement: >
          해당 설비/공사가 유해위험방지계획서 제출 대상에 해당하는지 판단 근거가 문서에
          제시되어 있으며, 대상인 경우 계획서 작성·제출 절차가 반영되어 있는가.
        reference: "산업안전보건법 제42조(유해위험방지계획서의 작성·제출 등)"
      - id: OSHA-006
        title: 유해위험방지계획서 이행 확인
        requirement: >
          유해위험방지계획서 심사 결과에 따른 이행사항 확인(착공 후 확인검사 등) 절차가
          문서화되어 있는가.
        reference: "산업안전보건법 제43조(유해위험방지계획서 이행의 확인 등)"
      - id: OSHA-007
        title: 공정안전보고서(PSM) 대상 설비 여부
        requirement: >
          시행령 별표에 따른 유해·위험물질 규정량 이상을 제조·취급·저장하는 설비인지
          판단 근거(물질명, 수량)가 문서에 제시되어 있는가.
        reference: "산업안전보건법 제44조(공정안전보고서의 작성·제출), 시행령 별표(유해·위험물질 규정량)"
      - id: OSHA-008
        title: 공정안전보고서 필수 구성요소 반영
        requirement: >
          대상 설비인 경우, 공정안전자료·공정위험성평가서(HAZOP 등)·안전운전계획·비상조치계획이
          문서 체계에 반영되어 있는가.
        reference: "산업안전보건법 제44조 및 시행규칙 상 공정안전보고서 구성요소 - 조번호 재확인 필요"

  - name: "위험성평가 및 방호조치"
    items:
      - id: OSHA-009
        title: 위험성평가 실시 및 결과 반영
        requirement: >
          설계·시공 단계에서 위험성평가(HAZID/HAZOP 등)를 실시하고 그 결과에 따른 저감대책이
          설계 변경에 반영된 근거가 있는가.
        reference: "산업안전보건법 상 위험성평가 관련 조항 - 정확한 조번호 확인 필요"
      - id: OSHA-010
        title: 기계·기구·설비의 방호조치
        requirement: >
          위험 기계·설비(압력용기, 회전체 등)에 대한 방호장치·안전인증 대상 여부와 그
          반영 여부가 문서화되어 있는가.
        reference: "산업안전보건법 상 안전조치 및 유해·위험 기계등 규정 - 조번호 확인 필요"
      - id: OSHA-011
        title: 물질안전보건자료(MSDS) 작성·비치
        requirement: >
          취급하는 화학물질(가스 포함)에 대한 물질안전보건자료가 작성되고 근로자에게
          제공되는 체계가 문서에 언급되어 있는가.
        reference: "산업안전보건법 상 물질안전보건자료 관련 조항 - 조번호 확인 필요"

  - name: "근로자 보호 및 비상조치"
    items:
      - id: OSHA-012
        title: 보호구 지급 및 착용 기준
        requirement: >
          가스 누출·화재·폭발 위험 작업에 대한 개인보호구(방독마스크, 방폭복 등) 지급 기준이
          명시되어 있는가.
        reference: "산업안전보건법 상 보호구 지급 관련 조항 - 조번호 확인 필요"
      - id: OSHA-013
        title: 안전보건교육 계획
        requirement: >
          해당 설비 운전·정비 인력에 대한 특별안전보건교육 등 교육계획이 문서에 반영되어
          있는가.
        reference: "산업안전보건법 상 안전보건교육 관련 조항 - 조번호 확인 필요"
      - id: OSHA-014
        title: 비상조치계획(대피·경보·대응체계)
        requirement: >
          중대산업사고·화재·폭발 발생 시 근로자 대피 절차, 경보체계, 외부 비상기관 연계
          체계가 문서화되어 있는가.
        reference: "산업안전보건법 및 공정안전보고서 상 비상조치계획 요건 - 조번호 확인 필요"
      - id: OSHA-015
        title: 도급 시 안전보건 조치(협력업체 관리)
        requirement: >
          시공·정비를 도급하는 경우 도급인의 안전보건 조치 의무(협의체 운영, 안전보건정보
          제공 등)가 반영되어 있는가.
        reference: "산업안전보건법 상 도급인의 안전보건조치 관련 조항 - 조번호 확인 필요"
